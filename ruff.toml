line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008", "E741"]   # long lines case-by-case; B008 FastAPI Depends; E741 pre-existing single-letter loop vars

[lint.per-file-ignores]
"migrations/*" = ["E", "F", "I", "UP"]
"tests/*" = ["B", "E", "F401"]
"scripts/*" = ["E402"]
"app/realtime/voice_profile.py" = ["E402"]
"app/capabilities.py" = ["E402"]
