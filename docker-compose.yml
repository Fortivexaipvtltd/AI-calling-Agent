services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: highh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: highh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highh -d highh"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://highh:${POSTGRES_PASSWORD:-changeme}@db:5432/highh
      AUTH_ENABLED: "1"
      API_KEYS: ${API_KEYS:?set at least one API key for production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.example.com}
      RBAC_ENABLED: "1"
      RATE_LIMIT_PER_MIN: "120"
      WEB_CONCURRENCY: "3"
      LOG_JSON: "1"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
